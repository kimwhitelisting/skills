# 냠냠졸졸 — Play에 올릴 출시 파일(AAB) 만들기. 올릴 때마다 한 번씩 누른다.
# 필요한 Secret: ANDROID_KEYSTORE_BASE64, ANDROID_KEY_PASSWORD (bento-life/docs/ANDROID.md "PC 없이 출시하기")
# versionCode는 이 작업을 돌린 횟수(run_number)라 누를 때마다 저절로 1씩 올라간다.
name: "Android 2) 출시 파일(AAB) 만들기"

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "버전 이름 (스토어에 보이는 버전, 예: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bento-life
    steps:
      - name: 확인
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: .
        run: |
          if ! echo "$VERSION_NAME" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then echo "::error::버전 이름은 1.0.0 같은 숫자 형식이어야 해요."; exit 1; fi
          if [ "$HAS_KEY" != "true" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64가 없어요. 먼저 'Android 1) 업로드 키 만들기'를 하세요."; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bento-life/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 설치 · 테스트
        run: |
          npm ci
          npm test

      - name: 웹 빌드 → 안드로이드로 복사
        run: |
          npm run build
          npx cap sync android

      - name: 서명 설정
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-key.jks"
            echo "storePassword=$KEY_PASSWORD"
            echo "keyAlias=upload"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: AAB 빌드
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ github.run_number }}
        working-directory: bento-life/android
        run: |
          ./gradlew bundleRelease --no-daemon -PappVersionCode="$VERSION_CODE" -PappVersionName="$VERSION_NAME"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified" || { echo "::error::서명이 안 됐어요"; exit 1; }
          mv app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/nyamjoljol-$VERSION_NAME-$VERSION_CODE.aab"
          echo "### 냠냠졸졸 $VERSION_NAME (versionCode $VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"
          echo "아래 Artifacts에서 받아 Play Console에 올리세요." >> "$GITHUB_STEP_SUMMARY"

      - name: 서명 정보 지우기
        if: always()
        run: rm -f android/keystore.properties "$RUNNER_TEMP/upload-key.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: nyamjoljol-${{ inputs.versionName }}-${{ github.run_number }}
          path: ${{ runner.temp }}/nyamjoljol-*.aab
          retention-days: 30
