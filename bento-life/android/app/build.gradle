apply plugin: 'com.android.application'

// 출시용 서명: android/keystore.properties 가 있으면 그걸로 서명한다 (키·비밀번호는 깃에 올리지 않는다 — docs/ANDROID.md)
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace = "com.paranstudio.dosirak"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.paranstudio.dosirak"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 버전: 깃허브 출시 작업이 -PappVersionCode / -PappVersionName으로 넘긴다 (없으면 1 / 1.0)
        versionCode((project.findProperty('appVersionCode') ?: '1') as Integer)
        versionName((project.findProperty('appVersionName') ?: '1.0') as String)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Direct Gradle Release calls must inspect the copied content, not just npm's mode.
def verifyBentoRelease = tasks.register('verifyBentoRelease', Exec) {
    workingDir rootProject.file('..')
    commandLine 'node', '--experimental-strip-types', 'scripts/verify-release-native.ts',
        '--assets', 'android/app/src/main/assets/public', '--capacitor', 'android/app/src/main/assets/capacitor.config.json'
}
// Independent verifier tasks have no outputs, so incremental packaging still checks.
def bentoPackageChecks = [:]
['packageRelease', 'packageReleaseBundle', 'signReleaseBundle'].each { producerName ->
    bentoPackageChecks[producerName] = tasks.register("verifyBento${producerName.capitalize()}Content") {
        doLast {
            def artifacts = tasks.named(producerName).get().outputs.files.asFileTree.matching {
                include '**/*.apk', '**/*.aab'
            }.files
            if (artifacts.empty) throw new GradleException('Release task produced no inspectable APK/AAB.')
            artifacts.each { artifact ->
                exec {
                    workingDir rootProject.file('..')
                    commandLine 'node', '--experimental-strip-types', 'scripts/verify-release-native.ts', '--archive', artifact.absolutePath
                }
            }
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') task.dependsOn verifyBentoRelease
    if (bentoPackageChecks.containsKey(task.name)) task.finalizedBy bentoPackageChecks[task.name]
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
